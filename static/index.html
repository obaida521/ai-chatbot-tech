<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nova AI Chatbot</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<style>
  :root{--bg:#0f1220;--panel:#171a2e;--user:#4f6bff;--bot:#1f2340;--text:#e8eaf6;--muted:#8d93b8;--err:#ff6b6b;--border:#2a2f55}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;justify-content:center}
  .app{width:100%;max-width:820px;display:flex;flex-direction:column;height:100vh}
  header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border);background:var(--panel)}
  header h1{font-size:18px;margin:0}
  header small{color:var(--muted);display:block;font-size:12px;margin-top:2px}
  .actions button{background:transparent;color:var(--text);border:1px solid var(--border);padding:7px 12px;border-radius:8px;cursor:pointer;margin-left:6px;font-size:13px}
  .actions button:hover{background:var(--bot)}
  #chat{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
  .msg{max-width:85%;padding:11px 14px;border-radius:14px;line-height:1.55;word-wrap:break-word;font-size:15px}
  .msg.user{align-self:flex-end;background:var(--user);border-bottom-right-radius:4px;white-space:pre-wrap}
  .msg.bot{align-self:flex-start;background:var(--bot);border-bottom-left-radius:4px}
  .msg.error{align-self:center;background:transparent;border:1px solid var(--err);color:var(--err);font-size:14px}
  .msg.bot p{margin:0 0 8px}.msg.bot p:last-child{margin:0}
  .msg.bot pre{background:#0b0d1a;padding:10px;border-radius:8px;overflow-x:auto;font-size:13px}
  .msg.bot code{background:#0b0d1a;padding:1px 5px;border-radius:4px;font-size:13px}
  .msg.bot pre code{padding:0;background:none}
  .msg.bot a{color:#9db0ff}
  .bot-tools{margin-top:6px;display:flex;gap:8px}
  .bot-tools button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:12px;padding:0}
  .bot-tools button:hover{color:var(--text)}
  .typing span{display:inline-block;width:7px;height:7px;margin:0 2px;background:var(--muted);border-radius:50%;animation:b 1.2s infinite}
  .typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
  @keyframes b{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-5px);opacity:1}}
  .welcome{margin:auto;text-align:center;color:var(--muted)}
  .chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
  .chips button{background:var(--panel);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:20px;cursor:pointer;font-size:13px}
  footer{padding:12px 18px;border-top:1px solid var(--border);background:var(--panel)}
  .row{display:flex;gap:8px;align-items:flex-end}
  textarea{flex:1;resize:none;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:11px 12px;font:inherit;max-height:140px;outline:none}
  textarea:focus{border-color:var(--user)}
  .btn{border:none;border-radius:10px;padding:11px 16px;cursor:pointer;font-weight:600;color:#fff;background:var(--user)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.mic{background:var(--bot);padding:11px 13px}
  .btn.mic.on{background:var(--err)}
  .meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:6px}
  .meta .over{color:var(--err)}
</style>
</head>
<body>
<div class="app">
  <header>
    <div><h1>🤖 Nova — AI Assistant</h1><small id="status">Ready</small></div>
    <div class="actions">
      <button id="speakToggle" title="Read answers aloud">🔇 Voice off</button>
      <button id="clearBtn">🗑 Clear chat</button>
    </div>
  </header>

  <div id="chat"></div>

  <footer>
    <div class="row">
      <button class="btn mic" id="micBtn" title="Voice input">🎤</button>
      <textarea id="input" rows="1" placeholder="Type your message… (Enter to send, Shift+Enter for new line)"></textarea>
      <button class="btn" id="sendBtn">Send</button>
    </div>
    <div class="meta"><span>Nova can make mistakes. Verify important info.</span><span id="counter">0 / 2000</span></div>
  </footer>
</div>

<script>
const MAX = 2000;
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const clearBtn = document.getElementById('clearBtn');
const micBtn = document.getElementById('micBtn');
const speakToggle = document.getElementById('speakToggle');
const statusEl = document.getElementById('status');
const counter = document.getElementById('counter');

let sessionId = localStorage.getItem('nova_session') || crypto.randomUUID();
localStorage.setItem('nova_session', sessionId);
let busy = false, speakOn = false;

marked.setOptions({breaks: true});
const render = md => DOMPurify.sanitize(marked.parse(md));

function welcome(){
  chat.innerHTML = `<div class="welcome" id="welcome"><h2>👋 Hi, I'm Nova</h2><p>Ask me about coding, AI, or anything tech.</p>
  <div class="chips">
   <button>Explain REST API simply</button><button>Write a Python function to reverse a string</button><button>Roman Urdu mein batao: AI kya hai?</button>
  </div></div>`;
  chat.querySelectorAll('.chips button').forEach(b => b.onclick = () => { input.value = b.textContent; send(); });
}

function addMsg(role, text){
  document.getElementById('welcome')?.remove();
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  if(role === 'bot') d.innerHTML = render(text); else d.textContent = text;
  chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
  return d;
}

function setBusy(b, text){
  busy = b; sendBtn.disabled = b; input.disabled = b;
  statusEl.textContent = text || (b ? 'Nova is thinking…' : 'Ready');
  if(!b) input.focus();
}

function addTools(div, text){
  const t = document.createElement('div'); t.className = 'bot-tools';
  const copy = document.createElement('button'); copy.textContent = '📋 Copy';
  copy.onclick = () => { navigator.clipboard.writeText(text); copy.textContent = '✅ Copied'; setTimeout(()=>copy.textContent='📋 Copy',1200); };
  const speak = document.createElement('button'); speak.textContent = '🔊 Listen';
  speak.onclick = () => speakText(text);
  t.append(copy, speak); div.appendChild(t);
}

function speakText(text){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const clean = text.replace(/```[\s\S]*?```/g,' code block ').replace(/[*#`_>-]/g,'');
  speechSynthesis.speak(new SpeechSynthesisUtterance(clean));
}

async function send(){
  const text = input.value.trim();
  if(busy) return;
  if(!text) return;                           // validation: empty
  if(text.length > MAX){ addMsg('error', `Message too long (max ${MAX} characters).`); return; }

  addMsg('user', text);
  input.value = ''; autosize(); updateCounter();
  const bot = addMsg('bot', ''); bot.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  setBusy(true);

  let full = '', failed = false;
  try{
    const res = await fetch('/api/chat', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({message:text, session_id:sessionId})
    });
    if(!res.ok){
      const j = await res.json().catch(()=>({}));
      throw new Error(j.error || `Server error (${res.status})`);
    }
    const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = '';
    while(true){
      const {value, done} = await reader.read(); if(done) break;
      buf += dec.decode(value, {stream:true});
      const parts = buf.split('\n\n'); buf = parts.pop();
      for(const p of parts){
        const ev = /event: (.*)/.exec(p)?.[1]; const data = JSON.parse(/data: (.*)/s.exec(p)?.[1] || '{}');
        if(ev === 'meta'){ sessionId = data.session_id; localStorage.setItem('nova_session', sessionId); }
        else if(ev === 'token'){ full += data.text; bot.innerHTML = render(full); chat.scrollTop = chat.scrollHeight; }
        else if(ev === 'error'){ throw new Error(data.message); }
      }
    }
    if(full){ addTools(bot, full); if(speakOn) speakText(full); }
  }catch(err){
    failed = true;
    if(full){ addTools(bot, full); } else bot.remove();
    addMsg('error', '⚠️ ' + (err.message === 'Failed to fetch' ? 'Cannot reach the server. Is it running?' : err.message));
  }finally{
    setBusy(false, failed ? 'Error — you can try again' : 'Ready');
  }
}

async function clearChat(){
  if(busy) return;
  await fetch('/api/clear', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({session_id:sessionId})}).catch(()=>{});
  sessionId = crypto.randomUUID(); localStorage.setItem('nova_session', sessionId);
  speechSynthesis?.cancel(); welcome(); statusEl.textContent = 'Chat cleared';
}

function autosize(){ input.style.height='auto'; input.style.height = Math.min(input.scrollHeight,140)+'px'; }
function updateCounter(){ counter.textContent = `${input.value.length} / ${MAX}`; counter.className = input.value.length > MAX ? 'over' : ''; }

input.addEventListener('input', () => { autosize(); updateCounter(); });
input.addEventListener('keydown', e => { if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); }});
sendBtn.onclick = send; clearBtn.onclick = clearChat;
speakToggle.onclick = () => { speakOn = !speakOn; speakToggle.textContent = speakOn ? '🔊 Voice on' : '🔇 Voice off'; if(!speakOn) speechSynthesis?.cancel(); };

// Voice input (Web Speech API - works in Chrome/Edge)
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if(SR){
  const rec = new SR(); rec.lang = 'en-US'; rec.interimResults = false;
  rec.onresult = e => { input.value += (input.value ? ' ' : '') + e.results[0][0].transcript; autosize(); updateCounter(); };
  rec.onend = () => micBtn.classList.remove('on');
  rec.onerror = () => micBtn.classList.remove('on');
  micBtn.onclick = () => { if(micBtn.classList.contains('on')) rec.stop(); else { rec.start(); micBtn.classList.add('on'); } };
}else{ micBtn.style.display = 'none'; }

welcome();
</script>
</body>
</html>
